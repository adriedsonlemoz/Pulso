name: Android • Pulso Bateria
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Instalar SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configurar Gradle e validar Wrapper
        uses: gradle/actions/setup-gradle@v4
      - name: Permissão do Wrapper
        run: chmod +x gradlew
      - name: Testes, lint e APK Debug
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace
      - name: Publicar APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: Pulso-Bateria-v0.1.0-alpha.2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Relatórios de validação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-validacao
          path: |
            core/build/reports/tests/
            app/build/reports/
          if-no-files-found: warn
