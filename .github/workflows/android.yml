name: Android • Pulso Bateria
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Instalar SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configurar Gradle e validar Wrapper
        uses: gradle/actions/setup-gradle@v4
      - name: Permissão do Wrapper
        run: chmod +x gradlew
      - name: Testes, lint e APK Debug
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace
      - name: Publicar somente APK direto
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          apk="Pulso-Bateria-v0.1.0-alpha.6-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          tag="apk-alpha.6-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" "$apk" --target "$GITHUB_SHA" --title "Pulso Bateria 0.1.0-alpha.6 • APK Debug" --notes-file RELEASE_NOTES.md --prerelease --latest=false
          url=$(gh release view "$tag" --json assets --jq '.assets[] | select(.name == "Pulso-Bateria-v0.1.0-alpha.6-debug.apk") | .url')
          test -n "$url"
          printf '### APK direto\n\n[Baixar %s](%s)\n' "$apk" "$url" >> "$GITHUB_STEP_SUMMARY"
